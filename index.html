<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0eee7">
<title>列车换装工作室 · Bogotá</title>
<style>
:root{--bg:#f2f0e9;--paper:#fcfaf5;--ink:#18201b;--muted:#5d625b;--edge:#dcdcd2;--green:#dce9a3;font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);color-scheme:light}
*{box-sizing:border-box}body{margin:0}h1,h2,h3,p{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #687d31;outline-offset:3px}.shell{width:min(1352px,calc(100% - 104px));margin:auto}.mast{border-bottom:1px solid #d8d9ce}.mast .shell{height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:12px;letter-spacing:.13em;font-size:.82rem;font-weight:850}.monogram{display:grid;place-items:center;width:37px;height:37px;background:#1e2c22;color:#e6edba;border-radius:11px;font-weight:900;font-size:1rem;letter-spacing:-.08em}.reset{border:1px solid #cdd2c4;background:transparent;padding:8px 13px;border-radius:8px;font-size:.86rem}.reset:hover{background:#e5e9d9}.intro{padding:32px 0 23px}.intro h1{font-size:clamp(2.1rem,4.8vw,4.0rem);letter-spacing:-.07em;font-weight:860;line-height:1.1}.intro p{margin-top:9px;color:var(--muted);font-size:.94rem}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 342px;gap:18px;align-items:start;margin-bottom:38px}.visual,.controls{border:1px solid var(--edge);border-radius:17px;overflow:hidden}.visual{background:#1c2926;color:#f1f3e8;position:sticky;top:15px}.visual-head,.visual-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px}.visual-head{border-bottom:1px solid #4d5950}.visual-head h2,.controls h2{font-size:1rem;font-weight:770}.views{display:flex;gap:4px;background:#111b17;border-radius:8px;padding:3px}.views button{background:transparent;border:0;border-radius:5px;padding:5px 9px;color:#e1ebdf;font-size:.79rem;min-height:31px}.views button[aria-pressed=true]{background:#dce9a3;color:#202a1b;font-weight:700}.scene{display:block;width:100%;height:auto;aspect-ratio:474/276;background:#23332d}.visual-foot{border-top:1px solid #48554d;flex-wrap:wrap}.visual-foot p{font-size:.85rem;color:#cbd4c7}.export{background:var(--green);color:#202b19;border:0;border-radius:8px;font-weight:760;font-size:.84rem;padding:9px 13px;min-height:40px}.export:hover{background:#edf4c9}.controls{background:var(--paper);padding:16px 16px 12px}.controls>h2{padding-bottom:12px}.part{padding:11px 0;border-top:1px solid #e5e2d9;min-width:0}.part h3{font-size:.875rem;margin-bottom:7px}.options{display:grid;grid-template-columns:repeat(var(--columns,4),minmax(0,1fr));gap:5px}.options button{border:1px solid #dfded5;border-radius:7px;background:#f6f4ed;padding:8px 2px;font-size:.76rem;min-height:38px;white-space:nowrap}.options button[aria-pressed=true]{border-color:#273728;background:#e4eccf;color:#233520;font-weight:750}.preset-row{display:flex;gap:6px;flex-wrap:wrap}.preset{display:flex;align-items:center;gap:5px;padding:5px 6px;border:1px solid #dedfd5;background:transparent;border-radius:8px;font-size:.73rem;min-height:32px}.preset[aria-pressed=true]{border-color:#495c43;background:#edf1e4}.chip{height:13px;width:13px;border-radius:50%;border:1px solid #45524044;flex:none}.colors,.ranges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.color{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:34px;min-width:0;font-size:.77rem;color:var(--muted);padding:0 5px 0 7px;border:1px solid #e3e2d7;border-radius:6px}.color input{border:0;width:29px;height:27px;background:transparent;padding:3px;cursor:pointer}.range{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.75rem;color:var(--muted);gap:2px 3px}.range output{font-weight:700;font-variant-numeric:tabular-nums}.range input{margin:2px 2px 0;width:100%;accent-color:#455c3c;cursor:pointer}.signature{font-size:.78rem;color:#cbd4c7;white-space:nowrap}.visual-meta{display:grid;gap:2px}.disclaimer{border-top:1px solid #e5e2d9;padding-top:9px;font-size:.72rem;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:1010px){.shell{width:calc(100% - 52px)}.workspace{grid-template-columns:minmax(0,1fr) 305px}}
@media(max-width:740px){.shell{width:calc(100% - 28px)}.workspace{grid-template-columns:1fr;gap:12px}.visual{top:6px;z-index:1}.intro{padding:24px 0 16px}.mast .shell{height:54px}.visual-head,.visual-foot{padding:9px 11px}.controls{padding:13px}.preset,.options button{min-height:42px}.range input{min-height:25px}.intro p{font-size:.86rem}}
</style>
<body>
<header class="mast"><div class="shell"><div class="identity"><span class="monogram" aria-hidden="true">M.</span> BOGOTÁ METRO STUDIO</div><button class="reset" id="reset" type="button">恢复默认</button></div></header>
<main class="shell">
  <div class="intro"><h1>列车换装工作室</h1><p>为波哥大地铁设计一套新外观。调整配色、车门、车窗和大灯，实时预览。</p></div>
  <div class="workspace">
    <section class="visual" aria-labelledby="preview">
      <header class="visual-head"><h2 id="preview">实时预览</h2><div id="views" class="views" role="group" aria-label="预览视角"></div></header>
      <canvas class="scene" id="scene" width="1920" height="1118" role="img" aria-label="波哥大地铁概念列车">列车造型需要支持 Canvas 的浏览器。</canvas>
      <div class="visual-foot"><div class="visual-meta"><p id="summary">波哥大红</p><span class="signature">小汤制作</span></div><button class="export" id="export" type="button">下载 PNG</button></div>
    </section>
    <aside class="controls" aria-labelledby="customize">
      <h2 id="customize">自定义部件</h2>
      <section class="part"><h3>车身配色</h3><div class="preset-row" id="presets" role="group" aria-label="配色预设"></div><div class="colors"><label class="color">车身主色<input type="color" id="bodyColor"></label><label class="color">饰条颜色<input type="color" id="trimColor"></label></div></section>
      <section class="part"><h3>车门</h3><div class="options" id="doors" role="group" aria-label="车门样式"></div><div class="ranges"><label class="range">门宽<output for="doorWidth"></output><input id="doorWidth" type="range" min="76" max="127" value="100" aria-label="门宽"></label><label class="range">门高<output for="doorHeight"></output><input id="doorHeight" type="range" min="80" max="115" value="100" aria-label="门高"></label></div></section>
      <section class="part"><h3>车窗</h3><div class="options" id="windows" role="group" aria-label="车窗样式"></div><div class="ranges"><label class="range">窗宽<output for="windowWidth"></output><input id="windowWidth" type="range" min="74" max="123" value="100" aria-label="窗宽"></label><label class="range">窗高<output for="windowHeight"></output><input id="windowHeight" type="range" min="75" max="123" value="100" aria-label="窗高"></label></div></section>
      <section class="part"><h3>前大灯</h3><div class="options" id="lights" role="group" aria-label="大灯样式"></div></section>
      <p class="disclaimer">概念造型 · 尺寸以预设比例表示</p>
    </aside>
  </div>
  <p class="sr" id="notice" role="status"></p>
</main>
<script>
'use strict';
const presets = {
  bogota: ['波哥大红','#dc253a','#edbd59'], pacific: ['深海蓝','#315ea1','#66d8e1'],
  forest: ['雨林绿','#547658','#d5eaa2'], ivory: ['晨雾白','#ddd8c8','#c45337']
};
const choices = {
  views: { perspective:'斜侧实景', front:'正面示意' },
  doors: { twin:'双开', panorama:'全景', flush:'无框', round:'圆舷窗' },
  windows: { classic:'宽矩形', round:'圆角舷窗', ribbon:'长条', capsule:'胶囊' },
  lights: { blade:'利刃', halo:'双光环', strip:'贯穿式', off:'关闭' }
};
const defaults = { bodyColor:'#dc253a',trimColor:'#edbd59',views:'perspective',doors:'twin',windows:'classic',lights:'blade',doorWidth:100,doorHeight:100,windowWidth:100,windowHeight:100 };
const dimensions = ['doorWidth','doorHeight','windowWidth','windowHeight'];
const colors = ['bodyColor','trimColor'];
const storageKey = 'bogota-metro-studio-v1';
const id = name => document.getElementById(name);
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch {}
let state = { ...defaults };
for(const [key,options] of Object.entries(choices)) if(Object.hasOwn(options,saved[key])) state[key]=saved[key];
for(const key of colors) if(/^#[0-9a-f]{6}$/i.test(saved[key])) state[key]=saved[key];
for(const key of dimensions) if(Number.isInteger(saved[key]) && saved[key]>=Number(id(key).min) && saved[key]<=Number(id(key).max)) state[key]=saved[key];
const canvas=id('scene');
const ctx=canvas.getContext('2d');

function addButton(target,key,label,color) {
  const button=document.createElement('button');
  button.type='button';
  button.dataset.key=key;
  if(color){
    button.className='preset';
    const chip=document.createElement('span');
    chip.className='chip';
    chip.style.background=color;
    button.append(chip);
  }
  button.append(label);
  id(target).append(button);
  button.addEventListener('click',()=>{
    if (target==='presets') [,state.bodyColor,state.trimColor]=presets[key];
    else {
      state[target]=key;
      if(target==='doors'||target==='windows') state.views='perspective';
    }
    sync();
  });
}
for(const [group,options] of Object.entries(choices))
  for(const [key,label] of Object.entries(options)) addButton(group,key,label);
for(const [key,[label,color]] of Object.entries(presets)) addButton('presets',key,label,color);
for(const key of [...colors,...dimensions]) id(key).addEventListener('input',()=>{
  state[key]=dimensions.includes(key)?Number(id(key).value):id(key).value;
  if(dimensions.includes(key)) state.views='perspective';
  sync();
});
id('reset').addEventListener('click',()=>{state={...defaults};sync();id('notice').textContent='已恢复默认造型。';});
id('export').addEventListener('click',()=>{
  if (state.views==='perspective' && !photoPixels) { id('notice').textContent='实景照片正在加载。';return; }
  const view=state.views;
  canvas.toBlob(blob=>{
    if(!blob) { id('notice').textContent='无法生成图片。';return; }
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download='bogota-metro-studio-'+(view==='front'?'front':'perspective')+'.png';
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    id('notice').textContent='PNG 已生成。';
  },'image/png');
});

function sync(){
  const palette=Object.keys(presets).find(k=>presets[k][1]===state.bodyColor&&presets[k][2]===state.trimColor);
  for(const group of [...Object.keys(choices),'presets']){
    const active=group==='presets'?palette:state[group];
    for(const el of id(group).children) el.setAttribute('aria-pressed',String(el.dataset.key===active));
  }
  for(const color of colors) id(color).value=state[color];
  for(const key of dimensions){
    id(key).value=state[key];
    id(key).parentElement.querySelector('output').value=state[key]+'%';
  }
  const label=(palette?presets[palette][0]:'自定义配色')+' · '+choices.doors[state.doors]+'门 · '+choices.windows[state.windows]+'窗';
  id('summary').textContent=label;
  canvas.setAttribute('aria-label',label+' · '+choices.views[state.views]+' · 大灯 '+choices.lights[state.lights]);
  draw();
  try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{}
}

const W=960,H=520;
const shape = path => new Path2D(path);
function fill(path,paint){ctx.fillStyle=paint;ctx.fill(typeof path==='string'?shape(path):path);}
function trace(path,paint,width=1){ctx.strokeStyle=paint;ctx.lineWidth=width;ctx.stroke(typeof path==='string'?shape(path):path);}
function box(x,y,w,h,r,paint){const p=new Path2D();p.roundRect(x,y,w,h,r);fill(p,paint);return p;}
function ellipse(x,y,rx,ry,paint){const p=new Path2D();p.ellipse(x,y,rx,ry,0,0,Math.PI*2);fill(p,paint);return p;}
function line(x,y,xx,yy,paint,width=1){const p=new Path2D();p.moveTo(x,y);p.lineTo(xx,yy);trace(p,paint,width);}
function gradient(x,y,xx,yy,stops){const g=ctx.createLinearGradient(x,y,xx,yy);for(const [at,color] of stops)g.addColorStop(at,color);return g;}
function tint(hex,amount){
  const n=parseInt(hex.slice(1),16);
  const values=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(amount>=0?v+(255-v)*amount:v*(1+amount)));
  return 'rgb('+values.join(',')+')';
}
function glass(x,y,h){
  return gradient(x,y,x+18,y+h,[[0,'#18242a'],[.22,'#637782'],[.37,'#334650'],[1,'#0b151b']]);
}
function draw(){
  if(!ctx) return;
  if(state.views==='perspective'){
    if(photoPixels) drawPhoto();
    return;
  }
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.fillStyle=gradient(0,0,0,H,[[0,'#243831'],[.64,'#304239'],[1,'#1c2a25']]);
  ctx.fillRect(0,0,W,H);
  ctx.save();
  for(let x=25;x<W;x+=27) for(let y=16;y<H;y+=27) {
    ctx.fillStyle='rgba(218,233,207,.19)';ctx.fillRect(x,y,1.4,1.4);
  }
  ctx.strokeStyle='#d3e3c146';ctx.lineWidth=1;ctx.setLineDash([7,7]);
  ctx.strokeRect(39,83,882,348);
  for(const x of [39,921])for(const y of [83,431]){
    ctx.setLineDash([]);line(x-5,y,x+5,y,'#aebfa0',1);line(x,y-5,x,y+5,'#aebfa0',1);
  }
  line(42,403,918,403,'#bac7aa33');
  ctx.font='600 13px system-ui, sans-serif';
  ctx.fillStyle='#cdddbd';
  ctx.fillText('BOGOTÁ / ESTUDIO FERROVIARIO',43,54);
  ctx.fillStyle='#a7b99f';ctx.textAlign='right';
  ctx.fillText(state.views==='front'?'VISTA FRONTAL':'VISTA PERSPECTIVA',917,478);
  ctx.strokeStyle='#c1d1ac66';
  for(let x=43;x<210;x+=8)line(x,469,x,x%5===3?478:474,'#c1d1ac66');
  ctx.restore();

  drawFront();
  ctx.save();
  ctx.scale(W/474,H/276);
  signImage();
  ctx.restore();
}

function rails(){
  fill('M32 399 L728 385 L921 417 L875 431 L48 429 Z','#1b2824');
  trace('M54 414 L898 408','#9ca798',2);
  trace('M64 425 L909 421','#566a5d',3);
  for(let x=70;x<910;x+=34) line(x,415,x+16,426,'#6e8071',2);
}

function drawLights(){
  if(state.lights==='off'){
    box(378,303,33,7,3,'#263431');box(549,303,33,7,3,'#263431');
    return;
  }
  ctx.save();
  ctx.shadowColor='#c7f3ff';ctx.shadowBlur=13;
  const color='#e5fbff';
  const [x1,x2,y1,y2]=[396,565,311,311];
  if(state.lights==='halo'){
    for(const [x,y] of [[x1,y1],[x2,y2]]){
      const ring=ellipse(x,y,10,9,'#34474c');trace(ring,color,2.5);
    }
  }else if(state.lights==='strip'){
    trace('M'+x1+' '+y1+' Q '+((x1+x2)/2)+' '+(Math.max(y1,y2)+32)+' '+x2+' '+y2,color,4);
  }else{
    trace('M'+(x1-16)+' '+(y1-8)+' l28 11',color,5);
    trace('M'+(x2-12)+' '+(y2+5)+' l23 -15',color,5);
  }
  ctx.restore();
}

function drawFront(){
  rails();
  const {bodyColor:body,trimColor:accent}=state;
  ellipse(480,390,179,24,'#101a1775');
  const profile='M369 168 Q389 127 480 125 Q571 127 591 168 Q613 215 604 295 Q599 345 574 370 Q553 393 480 395 Q407 393 386 370 Q361 345 356 295 Q347 215 369 168 Z';
  fill(profile,gradient(353,138,621,371,[[0,tint(body,.52)],[.25,body],[.7,tint(body,-.12)],[1,tint(body,-.55)]]));
  trace(profile,'#13201d',3);
  const wind='M388 166 Q415 140 480 140 Q545 140 572 166 Q590 197 579 255 Q567 301 543 320 Q517 342 480 343 Q443 342 417 320 Q393 301 381 255 Q370 197 388 166 Z';
  fill(wind,gradient(388,145,550,324,[[0,'#172229'],[.36,'#687d83'],[.7,'#26333b'],[1,'#141d20']]));
  trace(wind,'#181f22',3);
  fill('M382 182 Q467 144 574 172 L583 190 Q500 164 376 212 Z','#cbe5ed30');
  trace('M415 253 l79 39 M455 268 l91 25','#182426',3);
  box(438,157,84,15,6,'#142223');
  ctx.fillStyle='#e2ecab';ctx.textAlign='center';ctx.font='800 10px system-ui,sans-serif';ctx.fillText('BOGOTÁ',480,168);ctx.textAlign='start';
  drawLights();
  trace('M375 334 Q480 397 585 334',accent,3);
  fill('M397 360 Q480 412 563 360 L553 385 Q480 409 408 385 Z','#1b2625');
  box(462,376,36,12,3,'#54605b');box(472,379,16,5,2,'#1c2523');
}
const photoWidth=474,photoHeight=276;
const photo=new Image();
let photoPixels;
const photoLayer=document.createElement('canvas');
photoLayer.width=photoWidth;
photoLayer.height=photoHeight;
const pixels=photoLayer.getContext('2d',{willReadFrequently:true});
const bodyMask=shape('M37 123 L45 108 L78 97 L99 101 L115 112 L114 157 L100 182 L57 187 L40 160 Z M112 132 L268 53 Q307 27 367 44 Q402 52 416 82 Q432 122 420 171 L419 197 L378 209 L320 211 L289 197 L270 177 L118 163 Z');
const trimMask=shape('M114 156 L180 151 L264 159 L311 185 L343 203 L328 209 L305 199 L274 176 L114 168 Z');
const paintMasks=[bodyMask,trimMask].map(mask=>{
  const layer=document.createElement('canvas');
  layer.width=photoWidth;layer.height=photoHeight;
  const maskContext=layer.getContext('2d');
  maskContext.fill(mask);
  return maskContext.getImageData(0,0,photoWidth,photoHeight).data;
});
let lastPaint='';
photo.onload=()=>{
  pixels.drawImage(photo,0,0);
  photoPixels=pixels.getImageData(0,0,photoWidth,photoHeight);
  if(state.views==='perspective') draw();
};
photo.onerror=()=>{
  id('notice').textContent='实景照片加载失败，已切换到正面示意。';
  state.views='front';

const clamp=(n,low=0,high=1)=>Math.min(high,Math.max(low,n));
function rgb(hex){
  const value=parseInt(hex.slice(1),16);
  return [(value>>16)&255,(value>>8)&255,value&255];
}
function updatePhotoPaint(){
  const key=state.bodyColor+'|'+state.trimColor;
  if(key===lastPaint)return;
  const result=new ImageData(new Uint8ClampedArray(photoPixels.data),photoWidth,photoHeight);
  const paints=[state.bodyColor,state.trimColor].map(rgb);
  const change=[state.bodyColor!==defaults.bodyColor,state.trimColor!==defaults.trimColor];
  const [reds,yellows]=paintMasks;
  const p=result.data;
  for(let i=0;i<p.length;i+=4){
    if(!reds[i+3]&&!yellows[i+3])continue;
    const r=p[i],g=p[i+1],b=p[i+2];
    const isTrim=change[1]&&yellows[i+3]&&r-b>24&&g-b>17&&r-g<94&&g>85;
    const isBody=change[0]&&reds[i+3]&&r-Math.max(g,b)>20&&r>62&&g<r*.79;
    if(!isTrim&&!isBody)continue;
    const type=isTrim?1:0;
    const strength=isTrim
      ? clamp((Math.min(r-b,g-b)-12)/35)*yellows[i+3]/255
      : clamp((r-Math.max(g,b)-13)/43)*reds[i+3]/255;
    const shade=clamp(r/205,.25,1.22);
    const reflection=clamp((Math.min(g,b)-64)/130)*.54;
    for(let ch=0;ch<3;ch++){
      const paint=clamp(paints[type][ch]*shade*(1-reflection)+255*reflection,0,255);
      p[i+ch]=p[i+ch]+(paint-p[i+ch])*strength;
    }
  }
  pixels.putImageData(result,0,0);
  lastPaint=key;
}

function signImage(){
  box(391,249,70,17,4,'#15221ee0');
  ctx.fillStyle='#ffffff';
  ctx.font='700 8.8px "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('小汤制作',426,258);
  ctx.textAlign='start';
  ctx.textBaseline='alphabetic';
}

function drawPhoto(){
  updatePhotoPaint();
  ctx.setTransform(canvas.width/photoWidth,0,0,canvas.height/photoHeight,0,0);
  ctx.clearRect(0,0,photoWidth,photoHeight);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(photoLayer,0,0);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  const doorsChanged=state.doors!==defaults.doors||state.doorWidth!==100||state.doorHeight!==100;
  const windowsChanged=state.windows!==defaults.windows||state.windowWidth!==100||state.windowHeight!==100;
  if(windowsChanged)for(const slot of [[263,105,12,42],[212,119,10,33],[193,123,8,30],[156,135,7,23]]) photoWindow(...slot);
  if(doorsChanged)for(const slot of [[236,170,18,86],[174,163,13,52],[139,163,9,40]]) photoDoor(...slot);
  if(state.lights!==defaults.lights) photoLights();
  signImage();
}

function photoMetal(x,y,w,h){
  return gradient(x,y,x+w,y+h,[[0,tint(state.bodyColor,.12)],[.55,tint(state.bodyColor,-.15)],[1,tint(state.bodyColor,-.3)]]);
}
function photoGlass(x,y,h){
  return gradient(x,y,x+4,y+h,[[0,'#111c23'],[.26,'#495d65'],[.45,'#293f4a'],[1,'#111a1f']]);
}
function photoWindow(x,y,w,h){
  ctx.save();
  ctx.translate(x,y);
  ctx.transform(.97,-.23,.035,1,0,0);
  box(-w*.62,-h*.57,w*1.27,h*1.19,2,photoMetal(-w/2,-h/2,w,h));
  const width=w*state.windowWidth/100;
  const height=h*state.windowHeight/100*(state.windows==='ribbon'?.49:1);
  const pane=photoGlass(-width/2,-height/2,height);
  if(state.windows==='round'){
    const circle=ellipse(0,0,width*.52,height*.43,pane);
    trace(circle,'#19282b',1.1);
  }else{
    const radius=state.windows==='capsule'?width*.48:state.windows==='ribbon'?1.3:2.5;
    trace(box(-width/2,-height/2,width,height,radius,pane),'#19282b',1.1);
  }
  ctx.restore();
}
function photoDoor(x,y,w,h){
  ctx.save();
  ctx.translate(x,y);
  ctx.transform(.99,-.075,0,1,0,0);
  box(-w*.61,-h*1.05,w*1.22,h*1.05,1.6,photoMetal(-w/2,-h,w,h));
  const width=w*state.doorWidth/100,height=h*state.doorHeight/100;
  const left=-width/2,top=-height;
  const panel=state.doors==='panorama'?'#293437':photoMetal(left,top,width,height);
  trace(box(left,top,width,height,1.7,panel),'#202929',1.25);
  const pane=photoGlass(left,top,height*.54);
  if(state.doors==='panorama'||state.doors==='flush'){
    const inset=state.doors==='panorama'?1.8:width*.16;
    box(left+inset,top+height*.08,width-2*inset,height*(state.doors==='panorama'?.72:.46),1.4,pane);
  }else if(state.doors==='round'){
    for(const offset of [-.24,.24]){
      const port=ellipse(width*offset,top+height*.37,width*.15,width*.20,pane);
      trace(port,'#eef5f340',.6);
    }
  }else{
    const paneWidth=width*.35;
    for(const offset of [.1,.55])box(left+width*offset,top+height*.085,paneWidth,height*.52,1,pane);
  }
  if(state.doors!=='flush')line(0,top+1,0,-1,'#141d1d85',.75);
  line(left+1.5,-2.3,-left-1.5,-2.3,state.trimColor,.8);
  ctx.restore();
}
function photoLights(){
  const positions=[[320,140],[414,143],[48,140],[107,142]];
  for(const [x,y] of positions){
    const shade=ctx.createRadialGradient(x,y,1,x,y,9);
    shade.addColorStop(0,'#12212bf0');shade.addColorStop(1,'#12212b00');
    ellipse(x,y,9,7,shade);
  }
  if(state.lights==='off')return;
  ctx.save();ctx.shadowColor='#7acaff';ctx.shadowBlur=11;
  if(state.lights==='strip'){
    trace('M320 140 Q363 158 414 143 M48 140 Q76 151 107 142','#dff7ff',2);
  }else{
    for(const [x,y] of positions) trace(ellipse(x,y,x>300?4.6:2.4,x>300?4.2:2.2,'#2e3d45'),'#d8f7ff',1.25);
  }
  ctx.restore();
}
